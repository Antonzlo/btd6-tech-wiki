                - cell "320 340" [ref=f4e2639]
                - cell "Замороженные шары получают еще больше урона при «Обморожении». Силас чаще ставит ледяные стены. Обезьяны, способные замораживать шары, замораживают их на еще более долгий срок." [ref=f4e2640]
