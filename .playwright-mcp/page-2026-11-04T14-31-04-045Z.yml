                - cell "4 674" [ref=f4e3890]
                - cell "9 663" [ref=f4e3891]
                - cell "Когда одержимые шары взрываются, усиливается урон. Призрак наносит больше урона. Изучает навык «Уголь»." [ref=f4e3892]
              - row [ref=f4e3893]:
