                - cell "Дэн Д’Монке колет шары своим мечом." [ref=f4e833]
              - row [ref=f4e834]:
                - cell "2" [ref=f4e835]
                - cell "257" [ref=f4e836]
                - cell "257" [ref=f4e837]
                - cell "Дэн Д’Монке улучшает свой глазомер и может взмахивать мечом так, чтобы поражать больше шаров одновременно." [ref=f4e838]
              - row [ref=f4e839]:
                - cell "3" [ref=f4e840]
                - cell "656" [ref=f4e841]
                - cell "913" [ref=f4e842]
                - 'cell "Страшные рывки Дэна Д’Монке иногда отбивают шары назад. Способность трансформации: переключайтесь между Дэном Д’Монке и Замаскированной Макакой с всплеском энергии, который наносит урон ближайшим шарам и временно увеличивает скорость атаки." [ref=f4e843]'
              - row [ref=f4e844]:
                - cell "4" [ref=f4e845]
                - cell "1 425" [ref=f4e846]
                - cell "2 338" [ref=f4e847]
                - cell "Промежуточные техники фехтования увеличивают урон мечом. Дэн Д'Монке время от времени кидает на трассе сетчатую ловушку, которая может поймать шары." [ref=f4e848]
              - row [ref=f4e849]:
                - cell "5" [ref=f4e850]
                - cell "2 651" [ref=f4e851]
                - cell "4 989" [ref=f4e852]
                - cell "Когда шары прорываются, устрашающее присутствие Дэна Д’Монке снижает получаемый урон, одновременно отталкивая обратно любые другие шары, пытающиеся сбежать." [ref=f4e853]
              - row [ref=f4e854]:
                - cell "6" [ref=f4e855]
                - cell "4 674" [ref=f4e856]
                - cell "9 663" [ref=f4e857]
                - cell "Урон от атак мечом и способность к превращению увеличены." [ref=f4e858]
              - row [ref=f4e859]:
                - cell "7" [ref=f4e860]
                - cell "7 382" [ref=f4e861]
                - cell "17 045" [ref=f4e862]
                - 'cell "Способность переноса: Дэн Д’Монке может переместить обезьяну в новое место, включая самого себя." [ref=f4e863]'
              - row [ref=f4e864]:
                - cell "8" [ref=f4e865]
                - cell "11 856" [ref=f4e866]
                - cell "28 901" [ref=f4e867]
                - cell "Дэн Д'Монке время от времени выпускает на шары своё пылающее остроумие, отвлекая их и ослабляя их атаки на короткое время." [ref=f4e868]
              - row [ref=f4e869]:
                - cell "9" [ref=f4e870]
                - cell "13 367" [ref=f4e871]
                - cell "42 268" [ref=f4e872]
                - cell "Передовые техники фехтования Дэна Д'Монке позволяют ему выпускать вихрь коротких ударов через каждые несколько атак." [ref=f4e873]
              - row [ref=f4e874]:
                - cell "10" [ref=f4e875]
                - cell "19 409" [ref=f4e876]
                - cell "61 677" [ref=f4e877]
                - 'cell "Разжигатель толпы: Дэн Д’Монке поднимает дух близлежащих обезьян. Они атакуют медленнее, но наносят больший урон. Пассивные способности потери жизни активируются. Улучшенные обезьяны устойчивы к эффектам ослабления со стороны врагов." [ref=f4e878]'
              - row [ref=f4e879]:
                - cell "11" [ref=f4e880]
                - cell "23 342" [ref=f4e881]
                - cell "85 019" [ref=f4e882]
                - cell "Удары меча Дэна Д'Монке имеют увеличенный радиус действия и повышенную пробивную способность." [ref=f4e883]
              - row [ref=f4e884]:
                - cell "12" [ref=f4e885]
                - cell "20 520" [ref=f4e886]
                - cell "105 539" [ref=f4e887]
                - cell "Когда шар проскочит, вы получите короткий период уменьшенной потери жизней, и до 40 шаров, которые могли бы проскочить, будут отвлечены. После срабатывания запускается перезарядка. Пассивные способности снижения потери жизней всё ещё срабатывают." [ref=f4e888]
              - row [ref=f4e889]:
                - cell "13" [ref=f4e890]
                - cell "23 726" [ref=f4e891]
                - cell "129 265" [ref=f4e892]
                - cell "Мастерское владение мечом Дэна Д'Монке улучшает его технику серии коротких ударов." [ref=f4e893]
              - row [ref=f4e894]:
                - cell "14" [ref=f4e895]
                - cell "21 290" [ref=f4e896]
                - cell "150 555" [ref=f4e897]
                - cell "Дэн Д’Монке медленно восстанавливает жизни, потерянные из-за последнего просочившегося шара. Этот процесс прерывается и начинается заново, если просачиваются новые шары." [ref=f4e898]
              - row [ref=f4e899]:
                - cell "15" [ref=f4e900]
                - cell "23 342" [ref=f4e901]
                - cell "173 897" [ref=f4e902]
                - cell "Пробивная способность атак мечом увеличена. Все эффекты отвлечения обезьян и ветровые эффекты отталкивают шары ещё сильнее." [ref=f4e903]
              - row [ref=f4e904]:
                - cell "16" [ref=f4e905]
                - cell "25 394" [ref=f4e906]
                - cell "199 291" [ref=f4e907]
                - cell "Урон от атак мечом и способность превращения увеличены ещё больше." [ref=f4e908]
              - row [ref=f4e909]:
                - cell "17" [ref=f4e910]
                - cell "27 446" [ref=f4e911]
                - cell "226 737" [ref=f4e912]
                - cell "Длительность баффа после трансформации увеличена. Перезарядка способностей на 7-м и 10-м уровнях снижена." [ref=f4e913]
              - row [ref=f4e914]:
                - cell "18" [ref=f4e915]
                - cell "29 498" [ref=f4e916]
                - cell "256 235" [ref=f4e917]
                - cell "Приём вихря коротких ударов Дэна Д’Монке наносит дополнительные повреждения при втором и третьем попадании." [ref=f4e918]
              - row [ref=f4e919]:
                - cell "19" [ref=f4e920]
                - cell "23 470" [ref=f4e921]
                - cell "279 705" [ref=f4e922]
                - cell "Каждый шар, пробиваемый Дэном Д’Монке, генерирует Щит маны. Дэн Д’Монке наносит больший урон за каждый Щит маны." [ref=f4e923]
              - row [ref=f4e924]:
                - cell "20" [ref=f4e925]
                - cell "24 624" [ref=f4e926]
                - cell "304 329" [ref=f4e927]
                - cell "Чем опаснее бой, тем сильнее становится Дэн Д’Монке. Урон увеличивается по мере увеличения числа шаров, а скорость атаки растет по мере приближения шаров к прорыву." [ref=f4e928]
