          - generic [ref=e2408]:
            - paragraph [ref=e2409]: Повелитель льда
            - generic [ref=e2410]: "В игре: Силас выработал спокойный характер, выживая в одиночку в тяжелых условиях. Он повелевает льдом и усиливает ледяные атаки. Можно разместить его на земле или воде."
            - generic [ref=e2411]:
