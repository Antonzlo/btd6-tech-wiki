                - generic [ref=e2415]: "55"
                - text: дальность
              - generic [ref=e2416]:
                - generic [ref=e2417]: 320 340
                - text: XP до 20 уровня
          - table [ref=e2419]:
            - rowgroup [ref=e2420]:
              - row [ref=e2421]:
                - columnheader "Уровень" [ref=e2422]
                - columnheader "XP до уровня" [ref=e2423]
                - columnheader "XP всего" [ref=e2424]
                - columnheader "Что даёт" [ref=e2425]
            - rowgroup [ref=e2426]:
              - row [ref=e2427]:
                - cell "1" [ref=e2428]
                - cell "–" [ref=e2429]
                - cell "0" [ref=e2430]
                - cell "Силас атакует волшебным льдом, и пораженные шары покрываются ледяной коркой. Шары, уже бывшие обледенелыми, замораживаются. Обледенелые и замороженные шары получают больше урона, а шары возле Силаса замедляются." [ref=e2431]
              - row [ref=e2432]:
                - cell "2" [ref=e2433]
                - cell "270" [ref=e2434]
                - cell "270" [ref=e2435]
                - cell "Ледяные обезьяны в зоне действия при атаке создают кружащиеся ледяные осколки-снаряды." [ref=e2436]
              - row [ref=e2437]:
                - cell "3" [ref=e2438]
                - cell "690" [ref=e2439]
                - cell "960" [ref=e2440]
                - 'cell "Способность «Обморожение»: пока она действует, Силас может бить по белым шарам. Замороженные шары при попадании получают больше урона соответственно оставшемуся времени заморозки." [ref=e2441]'
              - row [ref=e2442]:
                - cell "4" [ref=e2443]
                - cell "1 500" [ref=e2444]
                - cell "2 460" [ref=e2445]
                - cell "На трассе возле Силаса появляются ледяные стены, отталкивающие и замораживающие шары. MOAB замерзают на меньший срок." [ref=e2446]
              - row [ref=e2447]:
                - cell "5" [ref=e2448]
                - cell "2 790" [ref=e2449]
                - cell "5 250" [ref=e2450]
                - cell "Белые шары хуже сопротивляются холодным атакам. Обезьяны, способные замораживать шары, замораживают их на более долгий срок." [ref=e2451]
              - row [ref=e2452]:
                - cell "6" [ref=e2453]
                - cell "4 920" [ref=e2454]
                - cell "10 170" [ref=e2455]
                - cell "Силас может атаковать шары в зоне поражения каких угодно ледяных обезьян." [ref=e2456]
              - row [ref=e2457]:
                - cell "7" [ref=e2458]
                - cell "7 770" [ref=e2459]
                - cell "17 940" [ref=e2460]
                - 'cell "Способность «Замороженный Каскад»: создает раскалывающую ледяную волну вокруг Сайласа, а затем вокруг других Ледяных Обезьян и Небожителей Хладноцепи, расходящуюся от Сайласа. Замороженные Шары получают дополнительный урон от способности." [ref=e2461]'
              - row [ref=e2462]:
                - cell "8" [ref=e2463]
                - cell "12 480" [ref=e2464]
                - cell "30 420" [ref=e2465]
                - cell "Увеличивает радиус действия всех Ледяных Обезьян и Небожителей Хладноцепи, а также дает больше Опыта Героя за каждую Ледяную Обезьяну 3-го уровня." [ref=e2466]
              - row [ref=e2467]:
                - cell "9" [ref=e2468]
                - cell "14 070" [ref=e2469]
                - cell "44 490" [ref=e2470]
                - cell "Замороженные шары, поврежденные во время действия «Обморожения», получают больше урона. Усилены урон и пробивание ледяных осколков." [ref=e2471]
              - row [ref=e2472]:
                - cell "10" [ref=e2473]
                - cell "20 430" [ref=e2474]
                - cell "64 920" [ref=e2475]
                - 'cell "Способность «Ледяное захоронение»: мгновенно замораживает и повреждает все шары, нанося куда больше урона уже замороженным. Затем ставит на трассе ледяные стены." [ref=e2476]'
              - row [ref=e2477]:
                - cell "11" [ref=e2478]
                - cell "24 570" [ref=e2479]
                - cell "89 490" [ref=e2480]
                - cell "Замедляющая аура вокруг Силаса лучше замедляет шары и может замедлить даже MOAB." [ref=e2481]
              - row [ref=e2482]:
                - cell "12" [ref=e2483]
                - cell "21 600" [ref=e2484]
                - cell "111 090" [ref=e2485]
                - cell "Ледяные стены поражают больше шаров и стоят дольше. Обледенелые и замороженные шары получают больше урона от основной атаки." [ref=e2486]
              - row [ref=e2487]:
                - cell "13" [ref=e2488]
                - cell "24 975" [ref=e2489]
                - cell "136 065" [ref=e2490]
                - cell "Ледяные обезьяны 5-го класса дешевле, и можно сделать 4-ю обезьяну 5-го класса с любым путем развития. Белые шары теряют всякий иммунитет к холодным атакам." [ref=e2491]
              - row [ref=e2492]:
                - cell "14" [ref=e2493]
                - cell "22 410" [ref=e2494]
                - cell "158 475" [ref=e2495]
                - cell "Ледяные обезьяны создают больше кружащихся осколков при атаке." [ref=e2496]
              - row [ref=e2497]:
                - cell "15" [ref=e2498]
                - cell "24 570" [ref=e2499]
                - cell "183 045" [ref=e2500]
                - cell "Замороженные шары получают больший урон от всех способностей. Заморозка длится дольше, а «Ледяной каскад» и «Ледяное захоронение» имеют более короткий откат." [ref=e2501]
              - row [ref=e2502]:
                - cell "16" [ref=e2503]
                - cell "26 730" [ref=e2504]
                - cell "209 775" [ref=e2505]
                - cell "Взрыв инея наносит ещё больший урон, а вращающиеся вокруг ледяные фрагменты наносят больший урон замороженным шарам." [ref=e2506]
              - row [ref=e2507]:
                - cell "17" [ref=e2508]
                - cell "28 890" [ref=e2509]
                - cell "238 665" [ref=e2510]
                - cell "Ледяные обезьяны 3-го класса создают еще больше кружащихся ледяных осколков." [ref=e2511]
              - row [ref=e2512]:
                - cell "18" [ref=e2513]
                - cell "31 050" [ref=e2514]
                - cell "269 715" [ref=e2515]
                - cell "Замедляющая аура вокруг Силаса замедляет шары еще больше. Обледенелые шары получают еще больше урона от холодных атак, а основная атака наносит больше урона по площади обледенелым и замороженным шарам." [ref=e2516]
              - row [ref=e2517]:
