                - cell "257" [ref=f2e836]
                - cell "257" [ref=f2e837]
                - cell "Дэн Д’Монке улучшает свой глазомер и может взмахивать мечом так, чтобы поражать больше шаров одновременно." [ref=f2e838]
              - row [ref=f2e839]:
                - cell "3" [ref=f2e840]
                - cell "656" [ref=f2e841]
                - cell "913" [ref=f2e842]
                - 'cell "Страшные рывки Дэна Д’Монке иногда отбивают шары назад. Способность трансформации: переключайтесь между Дэном Д’Монке и Замаскированной Макакой с всплеском энергии, который наносит урон ближайшим шарам и временно увеличивает скорость атаки." [ref=f2e843]'
              - row [ref=f2e844]:
                - cell "4" [ref=f2e845]
                - cell "1 425" [ref=f2e846]
                - cell "2 338" [ref=f2e847]
                - cell "Промежуточные техники фехтования увеличивают урон мечом. Дэн Д'Монке время от времени кидает на трассе сетчатую ловушку, которая может поймать шары." [ref=f2e848]
              - row [ref=f2e849]:
                - cell "5" [ref=f2e850]
                - cell "2 651" [ref=f2e851]
                - cell "4 989" [ref=f2e852]
                - cell "Когда шары прорываются, устрашающее присутствие Дэна Д’Монке снижает получаемый урон, одновременно отталкивая обратно любые другие шары, пытающиеся сбежать." [ref=f2e853]
              - row [ref=f2e854]:
                - cell "6" [ref=f2e855]
                - cell "4 674" [ref=f2e856]
                - cell "9 663" [ref=f2e857]
                - cell "Урон от атак мечом и способность к превращению увеличены." [ref=f2e858]
              - row [ref=f2e859]:
                - cell "7" [ref=f2e860]
                - cell "7 382" [ref=f2e861]
                - cell "17 045" [ref=f2e862]
                - 'cell "Способность переноса: Дэн Д’Монке может переместить обезьяну в новое место, включая самого себя." [ref=f2e863]'
              - row [ref=f2e864]:
                - cell "8" [ref=f2e865]
                - cell "11 856" [ref=f2e866]
                - cell "28 901" [ref=f2e867]
                - cell "Дэн Д'Монке время от времени выпускает на шары своё пылающее остроумие, отвлекая их и ослабляя их атаки на короткое время." [ref=f2e868]
              - row [ref=f2e869]:
                - cell "9" [ref=f2e870]
                - cell "13 367" [ref=f2e871]
                - cell "42 268" [ref=f2e872]
                - cell "Передовые техники фехтования Дэна Д'Монке позволяют ему выпускать вихрь коротких ударов через каждые несколько атак." [ref=f2e873]
              - row [ref=f2e874]:
                - cell "10" [ref=f2e875]
                - cell "19 409" [ref=f2e876]
                - cell "61 677" [ref=f2e877]
                - 'cell "Разжигатель толпы: Дэн Д’Монке поднимает дух близлежащих обезьян. Они атакуют медленнее, но наносят больший урон. Пассивные способности потери жизни активируются. Улучшенные обезьяны устойчивы к эффектам ослабления со стороны врагов." [ref=f2e878]'
              - row [ref=f2e879]:
                - cell "11" [ref=f2e880]
                - cell "23 342" [ref=f2e881]
                - cell "85 019" [ref=f2e882]
                - cell "Удары меча Дэна Д'Монке имеют увеличенный радиус действия и повышенную пробивную способность." [ref=f2e883]
              - row [ref=f2e884]:
                - cell "12" [ref=f2e885]
                - cell "20 520" [ref=f2e886]
                - cell "105 539" [ref=f2e887]
                - cell "Когда шар проскочит, вы получите короткий период уменьшенной потери жизней, и до 40 шаров, которые могли бы проскочить, будут отвлечены. После срабатывания запускается перезарядка. Пассивные способности снижения потери жизней всё ещё срабатывают." [ref=f2e888]
              - row [ref=f2e889]:
                - cell "13" [ref=f2e890]
                - cell "23 726" [ref=f2e891]
                - cell "129 265" [ref=f2e892]
                - cell "Мастерское владение мечом Дэна Д'Монке улучшает его технику серии коротких ударов." [ref=f2e893]
              - row [ref=f2e894]:
                - cell "14" [ref=f2e895]
                - cell "21 290" [ref=f2e896]
                - cell "150 555" [ref=f2e897]
                - cell "Дэн Д’Монке медленно восстанавливает жизни, потерянные из-за последнего просочившегося шара. Этот процесс прерывается и начинается заново, если просачиваются новые шары." [ref=f2e898]
              - row [ref=f2e899]:
                - cell "15" [ref=f2e900]
                - cell "23 342" [ref=f2e901]
                - cell "173 897" [ref=f2e902]
                - cell "Пробивная способность атак мечом увеличена. Все эффекты отвлечения обезьян и ветровые эффекты отталкивают шары ещё сильнее." [ref=f2e903]
              - row [ref=f2e904]:
                - cell "16" [ref=f2e905]
                - cell "25 394" [ref=f2e906]
                - cell "199 291" [ref=f2e907]
                - cell "Урон от атак мечом и способность превращения увеличены ещё больше." [ref=f2e908]
              - row [ref=f2e909]:
                - cell "17" [ref=f2e910]
                - cell "27 446" [ref=f2e911]
                - cell "226 737" [ref=f2e912]
                - cell "Длительность баффа после трансформации увеличена. Перезарядка способностей на 7-м и 10-м уровнях снижена." [ref=f2e913]
              - row [ref=f2e914]:
                - cell "18" [ref=f2e915]
                - cell "29 498" [ref=f2e916]
                - cell "256 235" [ref=f2e917]
                - cell "Приём вихря коротких ударов Дэна Д’Монке наносит дополнительные повреждения при втором и третьем попадании." [ref=f2e918]
              - row [ref=f2e919]:
                - cell "19" [ref=f2e920]
                - cell "23 470" [ref=f2e921]
                - cell "279 705" [ref=f2e922]
                - cell "Каждый шар, пробиваемый Дэном Д’Монке, генерирует Щит маны. Дэн Д’Монке наносит больший урон за каждый Щит маны." [ref=f2e923]
              - row [ref=f2e924]:
