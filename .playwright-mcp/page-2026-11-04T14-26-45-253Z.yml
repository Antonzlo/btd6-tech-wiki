                - cell "24 624" [ref=f2e926]
                - cell "304 329" [ref=f2e927]
                - cell "Чем опаснее бой, тем сильнее становится Дэн Д’Монке. Урон увеличивается по мере увеличения числа шаров, а скорость атаки растет по мере приближения шаров к прорыву." [ref=f2e928]
