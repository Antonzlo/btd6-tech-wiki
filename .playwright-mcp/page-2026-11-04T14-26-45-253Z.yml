                - columnheader "XP всего" [ref=f2e2538]
                - columnheader "Что даёт" [ref=f2e2539]
            - rowgroup [ref=f2e2540]:
              - row [ref=f2e2541]:
                - cell "1" [ref=f2e2542]
                - cell "–" [ref=f2e2543]
                - cell "0" [ref=f2e2544]
                - cell "Силас атакует волшебным льдом, и пораженные шары покрываются ледяной коркой. Шары, уже бывшие обледенелыми, замораживаются. Обледенелые и замороженные шары получают больше урона, а шары возле Силаса замедляются." [ref=f2e2545]
              - row [ref=f2e2546]:
                - cell "2" [ref=f2e2547]
                - cell "270" [ref=f2e2548]
                - cell "270" [ref=f2e2549]
                - cell "Ледяные обезьяны в зоне действия при атаке создают кружащиеся ледяные осколки-снаряды." [ref=f2e2550]
              - row [ref=f2e2551]:
                - cell "3" [ref=f2e2552]
                - cell "690" [ref=f2e2553]
                - cell "960" [ref=f2e2554]
                - 'cell "Способность «Обморожение»: пока она действует, Силас может бить по белым шарам. Замороженные шары при попадании получают больше урона соответственно оставшемуся времени заморозки." [ref=f2e2555]'
              - row [ref=f2e2556]:
                - cell "4" [ref=f2e2557]
                - cell "1 500" [ref=f2e2558]
                - cell "2 460" [ref=f2e2559]
                - cell "На трассе возле Силаса появляются ледяные стены, отталкивающие и замораживающие шары. MOAB замерзают на меньший срок." [ref=f2e2560]
              - row [ref=f2e2561]:
                - cell "5" [ref=f2e2562]
                - cell "2 790" [ref=f2e2563]
                - cell "5 250" [ref=f2e2564]
                - cell "Белые шары хуже сопротивляются холодным атакам. Обезьяны, способные замораживать шары, замораживают их на более долгий срок." [ref=f2e2565]
              - row [ref=f2e2566]:
                - cell "6" [ref=f2e2567]
                - cell "4 920" [ref=f2e2568]
                - cell "10 170" [ref=f2e2569]
                - cell "Силас может атаковать шары в зоне поражения каких угодно ледяных обезьян." [ref=f2e2570]
              - row [ref=f2e2571]:
                - cell "7" [ref=f2e2572]
                - cell "7 770" [ref=f2e2573]
                - cell "17 940" [ref=f2e2574]
                - 'cell "Способность «Замороженный Каскад»: создает раскалывающую ледяную волну вокруг Сайласа, а затем вокруг других Ледяных Обезьян и Небожителей Хладноцепи, расходящуюся от Сайласа. Замороженные Шары получают дополнительный урон от способности." [ref=f2e2575]'
              - row [ref=f2e2576]:
                - cell "8" [ref=f2e2577]
                - cell "12 480" [ref=f2e2578]
                - cell "30 420" [ref=f2e2579]
                - cell "Увеличивает радиус действия всех Ледяных Обезьян и Небожителей Хладноцепи, а также дает больше Опыта Героя за каждую Ледяную Обезьяну 3-го уровня." [ref=f2e2580]
              - row [ref=f2e2581]:
                - cell "9" [ref=f2e2582]
                - cell "14 070" [ref=f2e2583]
                - cell "44 490" [ref=f2e2584]
                - cell "Замороженные шары, поврежденные во время действия «Обморожения», получают больше урона. Усилены урон и пробивание ледяных осколков." [ref=f2e2585]
              - row [ref=f2e2586]:
                - cell "10" [ref=f2e2587]
                - cell "20 430" [ref=f2e2588]
                - cell "64 920" [ref=f2e2589]
                - 'cell "Способность «Ледяное захоронение»: мгновенно замораживает и повреждает все шары, нанося куда больше урона уже замороженным. Затем ставит на трассе ледяные стены." [ref=f2e2590]'
              - row [ref=f2e2591]:
                - cell "11" [ref=f2e2592]
                - cell "24 570" [ref=f2e2593]
                - cell "89 490" [ref=f2e2594]
                - cell "Замедляющая аура вокруг Силаса лучше замедляет шары и может замедлить даже MOAB." [ref=f2e2595]
              - row [ref=f2e2596]:
                - cell "12" [ref=f2e2597]
                - cell "21 600" [ref=f2e2598]
                - cell "111 090" [ref=f2e2599]
                - cell "Ледяные стены поражают больше шаров и стоят дольше. Обледенелые и замороженные шары получают больше урона от основной атаки." [ref=f2e2600]
              - row [ref=f2e2601]:
                - cell "13" [ref=f2e2602]
                - cell "24 975" [ref=f2e2603]
                - cell "136 065" [ref=f2e2604]
                - cell "Ледяные обезьяны 5-го класса дешевле, и можно сделать 4-ю обезьяну 5-го класса с любым путем развития. Белые шары теряют всякий иммунитет к холодным атакам." [ref=f2e2605]
              - row [ref=f2e2606]:
                - cell "14" [ref=f2e2607]
                - cell "22 410" [ref=f2e2608]
                - cell "158 475" [ref=f2e2609]
                - cell "Ледяные обезьяны создают больше кружащихся осколков при атаке." [ref=f2e2610]
              - row [ref=f2e2611]:
                - cell "15" [ref=f2e2612]
                - cell "24 570" [ref=f2e2613]
                - cell "183 045" [ref=f2e2614]
                - cell "Замороженные шары получают больший урон от всех способностей. Заморозка длится дольше, а «Ледяной каскад» и «Ледяное захоронение» имеют более короткий откат." [ref=f2e2615]
              - row [ref=f2e2616]:
                - cell "16" [ref=f2e2617]
                - cell "26 730" [ref=f2e2618]
                - cell "209 775" [ref=f2e2619]
                - cell "Взрыв инея наносит ещё больший урон, а вращающиеся вокруг ледяные фрагменты наносят больший урон замороженным шарам." [ref=f2e2620]
              - row [ref=f2e2621]:
                - cell "17" [ref=f2e2622]
                - cell "28 890" [ref=f2e2623]
                - cell "238 665" [ref=f2e2624]
                - cell "Ледяные обезьяны 3-го класса создают еще больше кружащихся ледяных осколков." [ref=f2e2625]
              - row [ref=f2e2626]:
                - cell "18" [ref=f2e2627]
                - cell "31 050" [ref=f2e2628]
                - cell "269 715" [ref=f2e2629]
                - cell "Замедляющая аура вокруг Силаса замедляет шары еще больше. Обледенелые шары получают еще больше урона от холодных атак, а основная атака наносит больше урона по площади обледенелым и замороженным шарам." [ref=f2e2630]
              - row [ref=f2e2631]:
