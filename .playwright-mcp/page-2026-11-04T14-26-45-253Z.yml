                - cell "294 420" [ref=f2e2634]
                - cell "Ледяные стены обладают большей пробивной способностью и долговечностью. Ледяные фрагменты пробивают больше и наносят ещё больший урон замороженным шарам." [ref=f2e2635]
              - row [ref=f2e2636]:
