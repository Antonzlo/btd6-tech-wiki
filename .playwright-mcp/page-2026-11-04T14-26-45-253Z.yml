            - paragraph [ref=f2e2522]: Повелитель льда
            - generic [ref=f2e2523]: "В игре: Силас выработал спокойный характер, выживая в одиночку в тяжелых условиях. Он повелевает льдом и усиливает ледяные атаки. Можно разместить его на земле или воде."
