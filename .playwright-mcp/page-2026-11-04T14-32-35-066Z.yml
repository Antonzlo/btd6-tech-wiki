                - cell "Одержимые шары слабеют и взрываются при пробитии, пополняя запас маны. По приказу Корвуса призрак атакует шары в любой точке карты. Изучает навыки «Копьё», «Питание» и «Отпор»." [ref=f5e3867]
              - row [ref=f5e3868]:
                - cell "2" [ref=f5e3869]
                - cell "257" [ref=f5e3870]
                - cell "257" [ref=f5e3871]
                - cell "Призрак вырастает и может атаковать больше шаров." [ref=f5e3872]
