        - generic [ref=f5e2516]:
          - generic [ref=f5e2517]:
            - heading "Силас" [level=2] [ref=f5e2518]
            - generic [ref=f5e2519]: Silas
          - generic [ref=f5e2521]:
            - paragraph [ref=f5e2522]: Повелитель льда
            - generic [ref=f5e2523]: "В игре: Силас выработал спокойный характер, выживая в одиночку в тяжелых условиях. Он повелевает льдом и усиливает ледяные атаки. Можно разместить его на земле или воде."
