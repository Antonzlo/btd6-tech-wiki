                - cell "0" [ref=f5e832]
                - cell "Дэн Д’Монке колет шары своим мечом." [ref=f5e833]
              - row [ref=f5e834]:
                - cell "2" [ref=f5e835]
                - cell "257" [ref=f5e836]
                - cell "257" [ref=f5e837]
                - cell "Дэн Д’Монке улучшает свой глазомер и может взмахивать мечом так, чтобы поражать больше шаров одновременно." [ref=f5e838]
              - row [ref=f5e839]:
                - cell "3" [ref=f5e840]
                - cell "656" [ref=f5e841]
                - cell "913" [ref=f5e842]
                - 'cell "Страшные рывки Дэна Д’Монке иногда отбивают шары назад. Способность трансформации: переключайтесь между Дэном Д’Монке и Замаскированной Макакой с всплеском энергии, который наносит урон ближайшим шарам и временно увеличивает скорость атаки." [ref=f5e843]'
              - row [ref=f5e844]:
                - cell "4" [ref=f5e845]
                - cell "1 425" [ref=f5e846]
                - cell "2 338" [ref=f5e847]
                - cell "Промежуточные техники фехтования увеличивают урон мечом. Дэн Д'Монке время от времени кидает на трассе сетчатую ловушку, которая может поймать шары." [ref=f5e848]
              - row [ref=f5e849]:
                - cell "5" [ref=f5e850]
                - cell "2 651" [ref=f5e851]
                - cell "4 989" [ref=f5e852]
                - cell "Когда шары прорываются, устрашающее присутствие Дэна Д’Монке снижает получаемый урон, одновременно отталкивая обратно любые другие шары, пытающиеся сбежать." [ref=f5e853]
              - row [ref=f5e854]:
                - cell "6" [ref=f5e855]
                - cell "4 674" [ref=f5e856]
                - cell "9 663" [ref=f5e857]
                - cell "Урон от атак мечом и способность к превращению увеличены." [ref=f5e858]
              - row [ref=f5e859]:
                - cell "7" [ref=f5e860]
                - cell "7 382" [ref=f5e861]
                - cell "17 045" [ref=f5e862]
                - 'cell "Способность переноса: Дэн Д’Монке может переместить обезьяну в новое место, включая самого себя." [ref=f5e863]'
              - row [ref=f5e864]:
                - cell "8" [ref=f5e865]
                - cell "11 856" [ref=f5e866]
                - cell "28 901" [ref=f5e867]
                - cell "Дэн Д'Монке время от времени выпускает на шары своё пылающее остроумие, отвлекая их и ослабляя их атаки на короткое время." [ref=f5e868]
              - row [ref=f5e869]:
                - cell "9" [ref=f5e870]
                - cell "13 367" [ref=f5e871]
                - cell "42 268" [ref=f5e872]
                - cell "Передовые техники фехтования Дэна Д'Монке позволяют ему выпускать вихрь коротких ударов через каждые несколько атак." [ref=f5e873]
              - row [ref=f5e874]:
                - cell "10" [ref=f5e875]
                - cell "19 409" [ref=f5e876]
                - cell "61 677" [ref=f5e877]
                - 'cell "Разжигатель толпы: Дэн Д’Монке поднимает дух близлежащих обезьян. Они атакуют медленнее, но наносят больший урон. Пассивные способности потери жизни активируются. Улучшенные обезьяны устойчивы к эффектам ослабления со стороны врагов." [ref=f5e878]'
              - row [ref=f5e879]:
                - cell "11" [ref=f5e880]
                - cell "23 342" [ref=f5e881]
                - cell "85 019" [ref=f5e882]
                - cell "Удары меча Дэна Д'Монке имеют увеличенный радиус действия и повышенную пробивную способность." [ref=f5e883]
              - row [ref=f5e884]:
                - cell "12" [ref=f5e885]
                - cell "20 520" [ref=f5e886]
                - cell "105 539" [ref=f5e887]
                - cell "Когда шар проскочит, вы получите короткий период уменьшенной потери жизней, и до 40 шаров, которые могли бы проскочить, будут отвлечены. После срабатывания запускается перезарядка. Пассивные способности снижения потери жизней всё ещё срабатывают." [ref=f5e888]
              - row [ref=f5e889]:
                - cell "13" [ref=f5e890]
                - cell "23 726" [ref=f5e891]
                - cell "129 265" [ref=f5e892]
                - cell "Мастерское владение мечом Дэна Д'Монке улучшает его технику серии коротких ударов." [ref=f5e893]
              - row [ref=f5e894]:
                - cell "14" [ref=f5e895]
                - cell "21 290" [ref=f5e896]
                - cell "150 555" [ref=f5e897]
                - cell "Дэн Д’Монке медленно восстанавливает жизни, потерянные из-за последнего просочившегося шара. Этот процесс прерывается и начинается заново, если просачиваются новые шары." [ref=f5e898]
              - row [ref=f5e899]:
                - cell "15" [ref=f5e900]
                - cell "23 342" [ref=f5e901]
                - cell "173 897" [ref=f5e902]
                - cell "Пробивная способность атак мечом увеличена. Все эффекты отвлечения обезьян и ветровые эффекты отталкивают шары ещё сильнее." [ref=f5e903]
              - row [ref=f5e904]:
                - cell "16" [ref=f5e905]
                - cell "25 394" [ref=f5e906]
                - cell "199 291" [ref=f5e907]
                - cell "Урон от атак мечом и способность превращения увеличены ещё больше." [ref=f5e908]
              - row [ref=f5e909]:
                - cell "17" [ref=f5e910]
                - cell "27 446" [ref=f5e911]
                - cell "226 737" [ref=f5e912]
                - cell "Длительность баффа после трансформации увеличена. Перезарядка способностей на 7-м и 10-м уровнях снижена." [ref=f5e913]
              - row [ref=f5e914]:
                - cell "18" [ref=f5e915]
                - cell "29 498" [ref=f5e916]
                - cell "256 235" [ref=f5e917]
                - cell "Приём вихря коротких ударов Дэна Д’Монке наносит дополнительные повреждения при втором и третьем попадании." [ref=f5e918]
              - row [ref=f5e919]:
                - cell "19" [ref=f5e920]
                - cell "23 470" [ref=f5e921]
                - cell "279 705" [ref=f5e922]
                - cell "Каждый шар, пробиваемый Дэном Д’Монке, генерирует Щит маны. Дэн Д’Монке наносит больший урон за каждый Щит маны." [ref=f5e923]
              - row [ref=f5e924]:
                - cell "20" [ref=f5e925]
                - cell "24 624" [ref=f5e926]
                - cell "304 329" [ref=f5e927]
                - cell "Чем опаснее бой, тем сильнее становится Дэн Д’Монке. Урон увеличивается по мере увеличения числа шаров, а скорость атаки растет по мере приближения шаров к прорыву." [ref=f5e928]
