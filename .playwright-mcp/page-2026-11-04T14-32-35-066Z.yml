                - cell "23 342" [ref=f5e3935]
                - cell "173 897" [ref=f5e3936]
                - cell "Огонь Угля падает чаще и наносит больше урона. Питание дает больше Денег за единицу Маны." [ref=f5e3937]
              - row [ref=f5e3938]:
