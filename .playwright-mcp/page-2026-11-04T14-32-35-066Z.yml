                - cell "23 342" [ref=f5e3915]
                - cell "85 019" [ref=f5e3916]
                - cell "Духовная связь означает, что призрак становится сильнее по мере заполнения запаса маны. «Сбор душ» наносит больше урона и ещё больше — керамическим шарам. «Примерзание» создает вечную мерзлоту." [ref=f5e3917]
