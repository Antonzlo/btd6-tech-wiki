                - cell "656" [ref=f5e3875]
                - cell "913" [ref=f5e3876]
                - 'cell "Способность «Сбор душ»: мгновенно вытягивает души из ближайших шаров. Изучает навыки «Эхо» и «Спешка»." [ref=f5e3877]'
              - row [ref=f5e3878]:
                - cell "4" [ref=f5e3879]
                - cell "1 425" [ref=f5e3880]
                - cell "2 338" [ref=f5e3881]
                - cell "Призрак наносит больше урона. Изучает навыки «Барьер души» и «Затаптывание»." [ref=f5e3882]
              - row [ref=f5e3883]:
                - cell "5" [ref=f5e3884]
                - cell "2 651" [ref=f5e3885]
                - cell "4 989" [ref=f5e3886]
                - cell "Изучает навыки «Примерзание», «Агрессия» и «Видение»." [ref=f5e3887]
              - row [ref=f5e3888]:
                - cell "6" [ref=f5e3889]
                - cell "4 674" [ref=f5e3890]
                - cell "9 663" [ref=f5e3891]
                - cell "Когда одержимые шары взрываются, усиливается урон. Призрак наносит больше урона. Изучает навык «Уголь»." [ref=f5e3892]
              - row [ref=f5e3893]:
                - cell "7" [ref=f5e3894]
                - cell "7 382" [ref=f5e3895]
                - cell "17 045" [ref=f5e3896]
                - 'cell "Способность «Переход»: Корвус перемещается в подходящее место. Изучает навыки «Сила предков» и «Злонамеренность»." [ref=f5e3897]'
              - row [ref=f5e3898]:
                - cell "8" [ref=f5e3899]
                - cell "11 856" [ref=f5e3900]
                - cell "28 901" [ref=f5e3901]
                - cell "Духовное равновесие означает, что запас маны заполняется быстрее, когда её почти не осталось. «Спешка» добавляет скорости и ловкости. Изучает навык «Шторм»." [ref=f5e3902]
              - row [ref=f5e3903]:
                - cell "9" [ref=f5e3904]
                - cell "13 367" [ref=f5e3905]
                - cell "42 268" [ref=f5e3906]
                - cell "Базовый урон призрака усиливается и наносит больше урона шарам MOAB. «Примерзание» может наносить урон шарам MOAB. «Барьер души» удерживает больше шаров." [ref=f5e3907]
              - row [ref=f5e3908]:
