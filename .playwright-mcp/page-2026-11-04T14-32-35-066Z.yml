                - cell "«Сила предков» наносит больше урона. Изучает навык «Перегрузка»." [ref=f5e3927]
              - row [ref=f5e3928]:
                - cell "14" [ref=f5e3929]
                - cell "21 290" [ref=f5e3930]
                - cell "150 555" [ref=f5e3931]
                - cell "Призрак наносит больше урона шарам. «Злонамеренность» наносит больше урона и ещё больше — керамическим шарам." [ref=f5e3932]
              - row [ref=f5e3933]:
