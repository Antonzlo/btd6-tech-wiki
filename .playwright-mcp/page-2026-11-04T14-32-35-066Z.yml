                - cell "19 409" [ref=f5e3910]
                - cell "61 677" [ref=f5e3911]
                - 'cell "Способность «Тёмный ритуал»: вытягивает души из множества шаров возле Корвуса. «Затаптывание» наносит больше урона большему количеству шаров. Изучает навык «Восстановление»." [ref=f5e3912]'
