                - text: XP до 20 уровня
          - table [ref=f5e2533]:
            - rowgroup [ref=f5e2534]:
              - row [ref=f5e2535]:
                - columnheader "Уровень" [ref=f5e2536]
                - columnheader "XP до уровня" [ref=f5e2537]
                - columnheader "XP всего" [ref=f5e2538]
                - columnheader "Что даёт" [ref=f5e2539]
            - rowgroup [ref=f5e2540]:
              - row [ref=f5e2541]:
                - cell "1" [ref=f5e2542]
                - cell "–" [ref=f5e2543]
                - cell "0" [ref=f5e2544]
                - cell "Силас атакует волшебным льдом, и пораженные шары покрываются ледяной коркой. Шары, уже бывшие обледенелыми, замораживаются. Обледенелые и замороженные шары получают больше урона, а шары возле Силаса замедляются." [ref=f5e2545]
              - row [ref=f5e2546]:
                - cell "2" [ref=f5e2547]
                - cell "270" [ref=f5e2548]
                - cell "270" [ref=f5e2549]
                - cell "Ледяные обезьяны в зоне действия при атаке создают кружащиеся ледяные осколки-снаряды." [ref=f5e2550]
              - row [ref=f5e2551]:
                - cell "3" [ref=f5e2552]
                - cell "690" [ref=f5e2553]
                - cell "960" [ref=f5e2554]
                - 'cell "Способность «Обморожение»: пока она действует, Силас может бить по белым шарам. Замороженные шары при попадании получают больше урона соответственно оставшемуся времени заморозки." [ref=f5e2555]'
              - row [ref=f5e2556]:
                - cell "4" [ref=f5e2557]
                - cell "1 500" [ref=f5e2558]
                - cell "2 460" [ref=f5e2559]
                - cell "На трассе возле Силаса появляются ледяные стены, отталкивающие и замораживающие шары. MOAB замерзают на меньший срок." [ref=f5e2560]
              - row [ref=f5e2561]:
                - cell "5" [ref=f5e2562]
                - cell "2 790" [ref=f5e2563]
                - cell "5 250" [ref=f5e2564]
                - cell "Белые шары хуже сопротивляются холодным атакам. Обезьяны, способные замораживать шары, замораживают их на более долгий срок." [ref=f5e2565]
              - row [ref=f5e2566]:
                - cell "6" [ref=f5e2567]
                - cell "4 920" [ref=f5e2568]
                - cell "10 170" [ref=f5e2569]
                - cell "Силас может атаковать шары в зоне поражения каких угодно ледяных обезьян." [ref=f5e2570]
              - row [ref=f5e2571]:
                - cell "7" [ref=f5e2572]
                - cell "7 770" [ref=f5e2573]
                - cell "17 940" [ref=f5e2574]
                - 'cell "Способность «Замороженный Каскад»: создает раскалывающую ледяную волну вокруг Сайласа, а затем вокруг других Ледяных Обезьян и Небожителей Хладноцепи, расходящуюся от Сайласа. Замороженные Шары получают дополнительный урон от способности." [ref=f5e2575]'
              - row [ref=f5e2576]:
                - cell "8" [ref=f5e2577]
                - cell "12 480" [ref=f5e2578]
                - cell "30 420" [ref=f5e2579]
                - cell "Увеличивает радиус действия всех Ледяных Обезьян и Небожителей Хладноцепи, а также дает больше Опыта Героя за каждую Ледяную Обезьяну 3-го уровня." [ref=f5e2580]
              - row [ref=f5e2581]:
                - cell "9" [ref=f5e2582]
                - cell "14 070" [ref=f5e2583]
                - cell "44 490" [ref=f5e2584]
                - cell "Замороженные шары, поврежденные во время действия «Обморожения», получают больше урона. Усилены урон и пробивание ледяных осколков." [ref=f5e2585]
              - row [ref=f5e2586]:
                - cell "10" [ref=f5e2587]
                - cell "20 430" [ref=f5e2588]
                - cell "64 920" [ref=f5e2589]
                - 'cell "Способность «Ледяное захоронение»: мгновенно замораживает и повреждает все шары, нанося куда больше урона уже замороженным. Затем ставит на трассе ледяные стены." [ref=f5e2590]'
              - row [ref=f5e2591]:
                - cell "11" [ref=f5e2592]
                - cell "24 570" [ref=f5e2593]
                - cell "89 490" [ref=f5e2594]
                - cell "Замедляющая аура вокруг Силаса лучше замедляет шары и может замедлить даже MOAB." [ref=f5e2595]
              - row [ref=f5e2596]:
                - cell "12" [ref=f5e2597]
                - cell "21 600" [ref=f5e2598]
                - cell "111 090" [ref=f5e2599]
                - cell "Ледяные стены поражают больше шаров и стоят дольше. Обледенелые и замороженные шары получают больше урона от основной атаки." [ref=f5e2600]
              - row [ref=f5e2601]:
                - cell "13" [ref=f5e2602]
                - cell "24 975" [ref=f5e2603]
                - cell "136 065" [ref=f5e2604]
                - cell "Ледяные обезьяны 5-го класса дешевле, и можно сделать 4-ю обезьяну 5-го класса с любым путем развития. Белые шары теряют всякий иммунитет к холодным атакам." [ref=f5e2605]
              - row [ref=f5e2606]:
                - cell "14" [ref=f5e2607]
                - cell "22 410" [ref=f5e2608]
                - cell "158 475" [ref=f5e2609]
                - cell "Ледяные обезьяны создают больше кружащихся осколков при атаке." [ref=f5e2610]
              - row [ref=f5e2611]:
                - cell "15" [ref=f5e2612]
                - cell "24 570" [ref=f5e2613]
                - cell "183 045" [ref=f5e2614]
                - cell "Замороженные шары получают больший урон от всех способностей. Заморозка длится дольше, а «Ледяной каскад» и «Ледяное захоронение» имеют более короткий откат." [ref=f5e2615]
              - row [ref=f5e2616]:
                - cell "16" [ref=f5e2617]
                - cell "26 730" [ref=f5e2618]
                - cell "209 775" [ref=f5e2619]
                - cell "Взрыв инея наносит ещё больший урон, а вращающиеся вокруг ледяные фрагменты наносят больший урон замороженным шарам." [ref=f5e2620]
              - row [ref=f5e2621]:
                - cell "17" [ref=f5e2622]
                - cell "28 890" [ref=f5e2623]
                - cell "238 665" [ref=f5e2624]
                - cell "Ледяные обезьяны 3-го класса создают еще больше кружащихся ледяных осколков." [ref=f5e2625]
              - row [ref=f5e2626]:
                - cell "18" [ref=f5e2627]
                - cell "31 050" [ref=f5e2628]
                - cell "269 715" [ref=f5e2629]
                - cell "Замедляющая аура вокруг Силаса замедляет шары еще больше. Обледенелые шары получают еще больше урона от холодных атак, а основная атака наносит больше урона по площади обледенелым и замороженным шарам." [ref=f5e2630]
              - row [ref=f5e2631]:
                - cell "19" [ref=f5e2632]
                - cell "24 705" [ref=f5e2633]
                - cell "294 420" [ref=f5e2634]
                - cell "Ледяные стены обладают большей пробивной способностью и долговечностью. Ледяные фрагменты пробивают больше и наносят ещё больший урон замороженным шарам." [ref=f5e2635]
              - row [ref=f5e2636]:
                - cell "20" [ref=f5e2637]
                - cell "25 920" [ref=f5e2638]
                - cell "320 340" [ref=f5e2639]
                - cell "Замороженные шары получают еще больше урона при «Обморожении». Силас чаще ставит ледяные стены. Обезьяны, способные замораживать шары, замораживают их на еще более долгий срок." [ref=f5e2640]
